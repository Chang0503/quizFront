<div class="out">


  <!-- 搜尋區塊 -->
  <div class="search-container" style="margin-bottom: 15px;">
    <h3 style="color: black; display: inline-block; margin-right: 10px;">標題：</h3>
    <input type="text" (input)="changeMonth($event)" placeholder="輸入標題關鍵字" style="vertical-align: middle;" />
    <button mat-raised-button color="accent" (click)="changeMonth($event)">
      <mat-icon>search</mat-icon>搜尋
    </button>
  </div>

  <!-- 表格 -->
  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="mat-table">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> 標題 </th>
        <td mat-cell *matCellDef="let element">
          <a style="cursor: pointer; text-decoration: underline; color: #1976d2;"
            (click)="navigateToAnswer(element.id)">
            {{ element.title }}
          </a>
        </td>
      </ng-container>

      <!-- 說明 -->
      <ng-container matColumnDef="direction">
        <th mat-header-cell *matHeaderCellDef> 說明 </th>
        <td mat-cell *matCellDef="let element">{{ element.direction }}</td>
      </ng-container>

      <!-- 開始日期 -->
      <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef> 開始日期 </th>
        <td mat-cell *matCellDef="let element">{{ element.startDate }}</td>
      </ng-container>

      <!-- 結束日期 -->
      <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef> 結束日期 </th>
        <td mat-cell *matCellDef="let element">{{ element.endDate }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[6, 12]" showFirstLastButtons></mat-paginator>
  </div>
</div>
<router-outlet></router-outlet>
